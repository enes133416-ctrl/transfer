name: Transfer Sistemi Derleme & Yayınlama (Build & Deploy)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Web Uygulaması & Gelişmiş Excel Derleme
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu (Excel Üretimi İçin)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gelişmiş Excel (.xlsx) Şablonunu Oluştur
        run: |
          pip install openpyxl
          python3 scripts/generate_excel_template.py

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Projeyi Derle (Vite + TypeScript Build)
        run: npm run build

      - name: Derlenen Paketleri Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Transfer-Takip-Paketi
          path: |
            dist/
            Dekalb_Transfer_Takip_Gelistirilmis.xlsx

      - name: GitHub Pages Artifact Hazırla
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages Üzerinde Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
